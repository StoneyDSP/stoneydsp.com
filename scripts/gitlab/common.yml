# Import this inside each platform file with:  include: { local: 'ci/common.yml' }
stages: [prepare, build, package]

.default-cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
        - vcpkg.json
      prefix: "v1-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    policy: pull-push
    paths:
      - .pnpm-store/
      - .vcpkg_downloads/
      - .vcpkg_cache/

.juce-common:
  variables:
    DEBIAN_FRONTEND: noninteractive
    VCPKG_ROOT: "$CI_PROJECT_DIR/vcpkg"
    VCPKG_DOWNLOADS: "$CI_PROJECT_DIR/.vcpkg_downloads"
    VCPKG_FORCE_SYSTEM_BINARIES: "1"
    # Optional: vcpkg binary caching
    VCPKG_BINARY_SOURCES: "clear;files,$CI_PROJECT_DIR/.vcpkg_cache,readwrite"
  before_script:
    # node + pnpm (Corepack) — adjust for non-Linux runners in their files
    - node --version || (curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs)
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
    # vcpkg
    - test -d "$VCPKG_ROOT" || git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
    - $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
    - mkdir -p "$VCPKG_DOWNLOADS" "$CI_PROJECT_DIR/.vcpkg_cache"
